{% extends "base.html" %}
{% block title %}Вход — PayTracker{% endblock %}
{% block content %}
<h2>Вход</h2>
<form method="post" action="/login" style="max-width:320px;">
    <label>Email<br><input type="email" name="email" required autofocus autocomplete="username"></label><br><br>
    <label>Пароль<br><input type="password" name="password" required autocomplete="current-password"></label><br><br>
    <button type="submit" class="btn">Войти</button>
</form>
{% endblock %}

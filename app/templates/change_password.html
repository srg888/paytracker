{% extends "base.html" %}
{% block title %}Смена пароля — PayTracker{% endblock %}
{% block content %}
<h2>Смена пароля</h2>
<form method="post" action="/account/change_password" style="max-width:320px;">
    <label>Текущий пароль<br><input type="password" name="current_password" required autocomplete="current-password"></label><br><br>
    <label>Новый пароль (не короче 8 символов)<br><input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label><br><br>
    <label>Повторите новый пароль<br><input type="password" name="new_password_confirm" required minlength="8" autocomplete="new-password"></label><br><br>
    <button type="submit" class="btn">Сменить пароль</button>
</form>
{% endblock %}
